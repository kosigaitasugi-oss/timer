```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現在時刻とテキスト表示・動画切り替え</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .clock-font {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4 relative overflow-x-hidden">

  <!-- 動画表示エリア（背景動画として再生） -->
  <video id="bg-video" autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover -z-10 opacity-40 transition-opacity duration-500">
    <source id="video-source" src="" type="video/mp4">
  </video>

  <!-- メインコンテンツ領域 -->
  <main class="w-full max-w-3xl flex flex-col items-center text-center z-10 space-y-6 my-auto">
    
    <!-- 日付表示 -->
    <div id="date" class="text-slate-400 text-lg md:text-2xl font-light tracking-wide">
      ----年--月--日 (ー)
    </div>

    <!-- 時刻表示（画面真ん中に大きく配置） -->
    <div class="bg-slate-800/60 backdrop-blur-md border border-slate-700/50 rounded-3xl p-6 md:p-12 shadow-2xl w-full">
      <div id="clock" class="clock-font text-5xl sm:text-7xl md:text-8xl font-bold tracking-tight text-white drop-shadow-md">
        00:00:00
      </div>
    </div>

    <!-- 下部の入力可能テキストエリア -->
    <div class="w-full bg-slate-800/50 backdrop-blur-md border border-slate-700/40 rounded-2xl p-6 shadow-lg text-left">
      <label for="user-text" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
        メッセージ / メモ (自由に編集できます)
      </label>
      <textarea id="user-text" rows="3" class="w-full bg-slate-900/60 text-slate-100 text-base md:text-lg border border-slate-700 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-y" placeholder="ここにテキストを入力してください..."></textarea>
    </div>

    <!-- 曜日選択ボタンエリア -->
    <div class="w-full bg-slate-800/40 backdrop-blur-md border border-slate-700/30 rounded-2xl p-4 shadow-lg">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">曜日別動画切り替え</p>
      <div class="flex flex-wrap justify-center gap-2 md:gap-3">
        <button onclick="changeVideo('monday')" class="day-btn px-4 py-2 bg-slate-700/80 hover:bg-indigo-600 focus:bg-indigo-600 rounded-xl text-sm font-medium transition-all shadow active:scale-95">月曜日</button>
        <button onclick="changeVideo('tuesday')" class="day-btn px-4 py-2 bg-slate-700/80 hover:bg-indigo-600 focus:bg-indigo-600 rounded-xl text-sm font-medium transition-all shadow active:scale-95">火曜日</button>
        <button onclick="changeVideo('wednesday')" class="day-btn px-4 py-2 bg-slate-700/80 hover:bg-indigo-600 focus:bg-indigo-600 rounded-xl text-sm font-medium transition-all shadow active:scale-95">水曜日</button>
        <button onclick="changeVideo('thursday')" class="day-btn px-4 py-2 bg-slate-700/80 hover:bg-indigo-600 focus:bg-indigo-600 rounded-xl text-sm font-medium transition-all shadow active:scale-95">木曜日</button>
        <button onclick="changeVideo('friday')" class="day-btn px-4 py-2 bg-slate-700/80 hover:bg-indigo-600 focus:bg-indigo-600 rounded-xl text-sm font-medium transition-all shadow active:scale-95">金曜日</button>
      </div>
    </div>

  </main>

  <script>
    // 時計を更新する関数
    function updateClock() {
      const now = new Date();

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      const day = dayNames[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('date').textContent = `${year}年${month}月${date}日 (${day})`;
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }

    // 1秒ごとに時計を更新
    setInterval(updateClock, 1000);
    updateClock();

    // 曜日ごとの動画ファイル一覧 (実際のリポジトリ内の動画ファイル名に打ち換えてください)
    const videoMap = {
      monday: 'monday.mp4',
      tuesday: 'tuesday.mp4',
      wednesday: 'wednesday.mp4',
      thursday: 'thursday.mp4',
      friday: 'friday.mp4'
    };

    // 動画切り替え関数
    function changeVideo(day) {
      const video = document.getElementById('bg-video');
      const source = document.getElementById('video-source');
      const videoUrl = videoMap[day];

      if (videoUrl) {
        source.src = videoUrl;
        video.load();
        video.play().catch(err => {
          console.log("自動再生がブロックされたか動画が見つかりません:", err);
        });
      }
    }
  </script>

</body>
</html>
```
